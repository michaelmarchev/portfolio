name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No package-lock.json is committed yet. Run `npm install` locally once
      # and commit the lockfile, and this switches to the faster, reproducible
      # `npm ci` automatically.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # The domain and base path are hardcoded in next.config.ts and
      # src/content/site.ts, so this step needs no environment at all.
      - name: Build static export
        run: npm run build

      # Belt and braces: public/.nojekyll is copied into out/ by Next, but if
      # it ever goes missing, Jekyll would silently drop the _next/ directory
      # and the site would render unstyled with no JavaScript.
      - name: Ensure .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
